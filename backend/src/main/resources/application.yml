spring:
  application:
    name: yingyou-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yingyou}
    username: ${DB_USER:yingyou}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    timeout: 7d
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  auth:
    expose-dev-tokens: false
